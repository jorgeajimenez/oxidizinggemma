          check: {
            q: "Why can't lower layers share their KV cache?",
            a: "Lower layers capture low-level syntactic and positional details that vary rapidly from layer to layer. By layer 14, semantic representations become high-level and shared attention keys become effective."
          }

      },
      {
        num: "Slide 09 / 12",
        title: "High-Throughput gRPC Streaming Engine",
        subtitle: "Tokio + Tonic: Sub-Millisecond Multiplexed Inter-Process Communication",
        content: `
          <p>Instead of exposing a slow HTTP JSON server directly inside the CUDA execution thread, we decouple compute and networking via <strong>gRPC (HTTP/2)</strong>:</p>
          <pre><code>// Protocol Buffer Contract (proto/inference.proto):
service InferenceService {
  rpc StreamGenerate (GenerateRequest) returns (stream GenerateResponse);
}</code></pre>
          <ul>
            <li><strong>Worker Thread:</strong> Dedicated CPU/GPU thread runs the Candle autoregressive decode loop.</li>
            <li><strong>Tokio Channel:</strong> Tokens are sent through non-blocking <code>mpsc::channel</code> into the gRPC response stream.</li>
          </ul>
        `,
        notes: {
          core: "Decoupling the ML execution loop from network I/O prevents client network hiccups from stalling GPU compute kernels.",
          script: "Show how `tokio::task::spawn_blocking` allows the CPU/GPU decoder to run uninterrupted while Tokio handles asynchronous network serialization on background worker threads.",
          check: {
            q: "What happens if a client disconnects mid-stream?",
            a: "The `tx.blocking_send()` call fails when the receiver drops, immediately breaking the Rust generation loop and freeing GPU compute."

            <li><strong>Goroutine Multiplexing:</strong> Efficiently maintains 10,000+ open HTTP SSE client streams.</li>
            <li><strong>Independent Resiliency:</strong> The gateway can be restarted or updated without dropping model weights from GPU VRAM.</li>

          <pre><code>// Go SSE Handler:
w.Header().Set("Content-Type", "text/event-stream")
flusher.Flush()</code></pre>

          script: "Highlight the separation of concerns: Rust manages VRAM, CUDA streams, and matrix multiplication. Go manages HTTP keep-alives, CORS, rate limits, and JSON marshaling.",

            q: "Why not write the API Gateway in Python FastAPI?",
            a: "Python FastAPI suffers from async event loop blocking and high memory consumption per connection, requiring heavy multi-process workers."

          check: {

    let currentSlide = 0;
    let notesVisible = true;

    function renderSlide(index) {
      const s = slides[index];
      const card = document.getElementById('slide-card');
      const notesContainer = document.getElementById('sidebar-notes');

      card.innerHTML = `
        <div>
          <div class="slide-header">
            <div class="slide-number">${s.num}</div>
            <h1 class="slide-title">${s.title}</h1>
            <div class="slide-subtitle">${s.subtitle}</div>
          </div>
          <div class="slide-body">
            ${s.content}
          </div>
        </div>
        <div class="slide-footer">
          <div>Oxidizing Gemma | Advanced Systems Engineering</div>
          <div class="controls">
            <button class="btn" onclick="prevSlide()" ${index === 0 ? 'disabled' : ''}>← Previous</button>
            <span>${index + 1} / ${slides.length}</span>
            <button class="btn" onclick="nextSlide()" ${index === slides.length - 1 ? 'disabled' : ''}>Next →</button>
          </div>
        </div>
      `;

      notesContainer.innerHTML = `
        <div class="sidebar-heading">Teacher's Lecture Guide</div>
        <div class="note-box">
          <div class="note-title">Core Concept to Land</div>
          <p>${s.notes.core}</p>
        </div>
        <div class="note-box">
          <div class="note-title">Lecture Script & Narrative</div>
          <p>${s.notes.script}</p>
        </div>
        <div class="concept-check">
          <div class="concept-check-title">Concept Checkpoint</div>
          <p><strong>Q:</strong> ${s.notes.check.q}</p>
          <button class="answer-toggle" onclick="toggleAnswer()">Reveal Answer</button>
          <div class="answer-content" id="answer-content">
            <strong>A:</strong> ${s.notes.check.a}
          </div>
        </div>
      `;
    }

    function toggleAnswer() {
      const ans = document.getElementById('answer-content');
      ans.classList.toggle('show');
    }

    function toggleNotes() {
      notesVisible = !notesVisible;
      const sidebar = document.getElementById('teacher-sidebar');
      const btn = document.getElementById('notes-btn');
      sidebar.classList.toggle('collapsed', !notesVisible);
      btn.classList.toggle('btn-active', notesVisible);
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'Home') {
        currentSlide = 0;
        renderSlide(currentSlide);
      } else if (e.key === 'End') {
        currentSlide = slides.length - 1;
        renderSlide(currentSlide);
      }
    });

    renderSlide(0);
  </script>
</body>
